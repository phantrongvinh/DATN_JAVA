spring.application.name=project
#################################
#-------------SQL---------------#
#################################
spring.datasource.url=jdbc:mysql://localhost:3306/datn_shopping?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#################################
#---------JWT,EXPIRATION--------#
#################################
#################################
#---------OAUTH2-GOOGLE---------#
#################################
spring.config.import=optional:classpath:application-secret.properties,optional:classpath:application-oauth2.properties,optional:classpath:application-mail.properties,optional:classpath:application-vnpay.properties,optional:classpath:application-ghn.properties

#################################
